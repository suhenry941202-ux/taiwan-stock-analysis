<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台股全方位觀測站</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --card-bg: #ffffff; --text: #1e293b; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); max-width: 850px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
        
        /* 標題區域 */
        header { margin-bottom: 30px; border-bottom: 2px solid #e2e8f0; padding-bottom: 20px; }
        
        /* 卡片設計 */
        .card { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; }
        
        /* 分頁邏輯 */
        .tab-menu { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 10px 24px; border: none; border-radius: 8px; cursor: pointer; background: #e2e8f0; font-weight: 600; transition: 0.3s; }
        .tab-btn.active { background: var(--primary); color: white; }
        .tab-content { display: none; animation: fadeIn 0.4s; }
        .tab-content.active { display: block; }

        /* 清單樣式 */
        ul { list-style: none; padding: 0; }
        li { padding: 10px; border-bottom: 1px solid #f1f5f9; transition: 0.2s; }
        li:hover { background: #f1f5f9; border-radius: 6px; }
        a { text-decoration: none; color: var(--primary); font-weight: 500; display: block; }
        
        /* 表格優化 */
        .pop-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .pop-table th { background: #f8fafc; padding: 12px; text-align: left; font-size: 0.9rem; color: #64748b; }
        .pop-table td { padding: 12px; border-bottom: 1px solid #f1f5f9; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <header>
        <h2>📈 台股全方位觀測系統</h2>
        <div style="font-size: 0.9rem; color: #64748b;">即時市場掃描與訊號監控</div>
    </header>

    <div class="card">
        <div style="display: flex; justify-content: space-between;">
            <div>📅 <b>日期：</b> <span id="data-date">讀取中...</span></div>
            <div>🚦 <b>狀態：</b> <span id="sys-status" style="color: var(--primary);">讀取中...</span></div>
        </div>
    </div>

    <div class="tab-menu">
        <button class="tab-btn active" onclick="switchTab('ma-page', this)">📊 均線訊號</button>
        <button class="tab-btn" onclick="switchTab('popular-page', this)">🔥 熱門排行</button>
    </div>

    <div id="ma-page" class="tab-content active">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="card"><h3>🔴 黃金交叉 (<span id="count-g">0</span>)</h3><ul id="list-golden"></ul></div>
            <div class="card"><h3>🟢 死亡交叉 (<span id="count-d">0</span>)</h3><ul id="list-death"></ul></div>
        </div>
    </div>

    <div id="popular-page" class="tab-content">
        <div class="card">
            <table class="pop-table">
                <thead><tr><th>代號</th><th>名稱</th><th>收盤價</th><th>金額(億)</th></tr></thead>
                <tbody id="table-popular-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        function switchTab(pageId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            btn.classList.add('active');
        }

        fetch('results.json?t=' + new Date().getTime())
            .then(r => r.json())
            .then(data => {
                document.getElementById('data-date').innerText = data.data_date;
                document.getElementById('sys-status').innerText = data.status;
                const render = (id, countId, list) => {
                    const el = document.getElementById(id);
                    document.getElementById(countId).innerText = list.length;
                    list.forEach(item => {
                        const code = item.match(/\((\d+)\)/)[1];
                        el.innerHTML += `<li><a href="https://www.wantgoo.com/stock/astock/techchart?stockno=${code}" target="_blank">${item}</a></li>`;
                    });
                };
                render('list-golden', 'count-g', data.golden);
                render('list-death', 'count-d', data.death);
                const pBody = document.getElementById('table-popular-body');
                data.top10.forEach(s => {
                    pBody.innerHTML += `<tr><td>${s.code}</td><td>${s.name}</td><td>${s.price}</td><td>${s.value}</td></tr>`;
                });
            });
    </script>
</body>
</html>
