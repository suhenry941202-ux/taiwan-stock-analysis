<!DOCTYPE html>
<html>
<body>
    <h1>台股交叉分析結果</h1>
    <div id="content">載入中...</div>

    <script>
        // 自動讀取倉庫內的 results.json
        fetch('results.json')
            .then(response => response.json())
            .then(data => {
                let html = "<h2>黃金交叉標的:</h2><ul>";
                data.golden.forEach(sid => html += `<li>${sid}</li>`);
                html += "</ul><h2>死亡交叉標的:</h2><ul>";
                data.death.forEach(sid => html += `<li>${sid}</li>`);
                html += "</ul>";
                document.getElementById('content').innerHTML = html;
            })
            .catch(err => document.getElementById('content').innerHTML = "目前暫無數據");
    </script>
</body>
</html>
