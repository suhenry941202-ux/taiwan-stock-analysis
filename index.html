<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>專業投資監測站</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; }
        body { font-family: sans-serif; background: var(--bg); max-width: 600px; margin: 40px auto; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 10px 20px; cursor: pointer; border: none; border-radius: 8px; background: #e2e8f0; }
        .tab-btn.active { background: var(--primary); color: white; }
        .content { display: none; }
        .content.active { display: block; }
        a { text-decoration: none; color: var(--primary); font-weight: bold; }
    </style>
</head>
<body>
    <h2>📊 投資監測儀表板</h2>
    <div class="tabs">
        <button class="tab-btn active" onclick="show('ma-page', this)">ETF 交叉分析</button>
        <button class="tab-btn" onclick="show('hot-page', this)">每日熱門排行</button>
    </div>
    
    <div id="ma-page" class="content active">
        <div class="card"><h3>🔴 黃金交叉 (0050/006208)</h3><ul id="list-g"></ul></div>
        <div class="card"><h3>🟢 死亡交叉 (0050/006208)</h3><ul id="list-d"></ul></div>
    </div>
    
    <div id="hot-page" class="content">
        <div class="card"><h3>🔥 當日熱門股票前 10 名</h3><ul id="list-hot"></ul></div>
    </div>

    <script>
        function show(id, btn) {
            document.querySelectorAll('.content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
        }
        fetch('results.json?t=' + new Date().getTime())
            .then(r => r.json())
            .then(data => {
                const render = (id, list) => {
                    const el = document.getElementById(id);
                    el.innerHTML = list.length ? "" : "<li>目前無訊號</li>";
                    list.forEach(item => {
                        const code = item.match(/\d+/)[0];
                        el.innerHTML += `<li><a href="https://www.wantgoo.com/stock/astock/techchart?stockno=${code}" target="_blank">${item}</a></li>`;
                    });
                };
                render('list-g', data.golden);
                render('list-d', data.death);
                data.top10.forEach(s => document.getElementById('list-hot').innerHTML += `<li>${s.code} ${s.name}</li>`);
            });
    </script>
</body>
</html>
