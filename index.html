<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>台股全市場交叉監測</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        .box { padding: 20px; border-radius: 12px; margin-bottom: 20px; color: white; }
        .golden { background: #dc3545; }
        .death { background: #28a745; }
        a { color: white; text-decoration: underline; }
    </style>
</head>
<body>
    <h2>🚀 全市場交叉訊號</h2>
    <div id="status">讀取中...</div>
    <div class="box golden"><h3>黃金交叉</h3><ul id="list-g"></ul></div>
    <div class="box death"><h3>死亡交叉</h3><ul id="list-d"></ul></div>
    <script>
        fetch('results.json?t=' + new Date().getTime())
            .then(r => r.json())
            .then(data => {
                document.getElementById('status').innerText = "最後更新: " + data.update_time;
                const render = (id, list) => {
                    const el = document.getElementById(id);
                    list.forEach(item => {
                        const code = item.match(/\((\d+)\)/)[1];
                        el.innerHTML += `<li><a href="https://www.wantgoo.com/stock/astock/techchart?stockno=${code}" target="_blank">${item}</a></li>`;
                    });
                };
                render('list-g', data.golden);
                render('list-d', data.death);
            });
    </script>
</body>
</html>
