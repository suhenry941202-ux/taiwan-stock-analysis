<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>台股分析</title>
</head>
<body>
    <h1>台股均線分析報告</h1>
    <p>最後更新時間：<span id="timestamp"></span></p>
    <div id="content">讀取中...</div>

    <script>
        // 加入時間戳記，確認網頁真的有更新
        document.getElementById('timestamp').innerText = new Date().toLocaleString();

        fetch('results.json?t=' + new Date().getTime()) // 加上 ?t=... 強制避開快取
            .then(response => response.json())
            .then(data => {
                let html = `<div><h3>黃金交叉:</h3><p>${data.golden.length > 0 ? data.golden.join(', ') : '目前無'}</p></div>`;
                html += `<div><h3>死亡交叉:</h3><p>${data.death.length > 0 ? data.death.join(', ') : '目前無'}</p></div>`;
                document.getElementById('content').innerHTML = html;
            });
    </script>
</body>
</html>
