<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>ETF 交叉監測站</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --card-bg: #ffffff; }
        body { font-family: sans-serif; background: var(--bg); max-width: 600px; margin: 40px auto; padding: 20px; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .tab-menu { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 10px 24px; border: none; border-radius: 8px; cursor: pointer; background: #e2e8f0; font-weight: 600; }
        .tab-btn.active { background: var(--primary); color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        a { text-decoration: none; color: var(--primary); font-weight: 500; }
    </style>
</head>
<body>
    <h2>📈 ETF 交叉監測系統</h2>
    <div class="tab-menu">
        <button class="tab-btn active" onclick="switchTab('ma-page', this)">📊 均線訊號</button>
        <button class="tab-btn" onclick="switchTab('list-page', this)">📋 目前價格</button>
    </div>
    <div id="ma-page" class="tab-content active">
        <div class="card"><h3>🔴 黃金交叉</h3><ul id="list-g"></ul></div>
        <div class="card"><h3>🟢 死亡交叉</h3><ul id="list-d"></ul></div>
    </div>
    <div id="list-page" class="tab-content">
        <div class="card"><ul id="list-all"></ul></div>
    </div>
    <script>
        function switchTab(id, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
        }
        fetch('results.json?t=' + new Date().getTime())
            .then(r => r.json())
            .then(data => {
                const render = (id, list) => list.forEach(item => {
                    const code = item.match(/\d+/)[0];
                    document.getElementById(id).innerHTML += `<li><a href="https://www.wantgoo.com/stock/astock/techchart?stockno=${code}" target="_blank">${item}</a></li>`;
                });
                if(data.golden.length === 0) document.getElementById('list-g').innerHTML = '<li>目前無訊號</li>';
                else render('list-g', data.golden);
                if(data.death.length === 0) document.getElementById('list-d').innerHTML = '<li>目前無訊號</li>';
                else render('list-d', data.death);
                data.list.forEach(s => document.getElementById('list-all').innerHTML += `<li>${s.code}: ${s.price}元</li>`);
            });
    </script>
</body>
</html>
