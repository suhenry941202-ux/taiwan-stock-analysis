<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>台股全方位觀測站</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 30px auto; padding: 20px; }
        .card { background: #f8f9fa; padding: 15px; border-left: 5px solid #007bff; border-radius: 4px; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .box { padding: 15px; border: 1px solid #ddd; border-radius: 4px; }
        a { text-decoration: none; color: #0056b3; font-weight: bold; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h2>📈 台股全方位觀測系統 (100-500元策略)</h2>
    <div class="card">
        <div>📅 資料日期：<span id="data-date">讀取中...</span></div>
        <div>🚦 狀態：<span id="sys-status">讀取中...</span></div>
    </div>
    <div class="grid">
        <div class="box"><h3>🔴 黃金交叉 (<span id="count-g">0</span>)</h3><ul id="list-golden"></ul></div>
        <div class="box"><h3>🟢 死亡交叉 (<span id="count-d">0</span>)</h3><ul id="list-death"></ul></div>
    </div>
    <script>
        fetch('results.json?t=' + new Date().getTime())
            .then(r => r.json())
            .then(data => {
                document.getElementById('data-date').innerText = data.data_date;
                document.getElementById('sys-status').innerText = data.status;
                const render = (id, countId, list) => {
                    const el = document.getElementById(id);
                    document.getElementById(countId).innerText = list.length;
                    list.forEach(item => {
                        const code = item.match(/\((\d+)\)/)[1];
                        el.innerHTML += `<li><a href="https://www.wantgoo.com/stock/astock/techchart?stockno=${code}" target="_blank">${item}</a></li>`;
                    });
                };
                render('list-golden', 'count-g', data.golden);
                render('list-death', 'count-d', data.death);
            });
    </script>
</body>
</html>
