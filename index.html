<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台股全方位觀測站</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 30px auto; padding: 0 20px; color: #333; }
        .card { background: #f8f9fa; border-left: 5px solid #007bff; padding: 15px; margin-bottom: 20px; border-radius: 4px; }
        
        /* 分頁樣式 */
        .tab-menu { display: flex; border-bottom: 2px solid #ddd; margin-bottom: 20px; gap: 5px; }
        .tab-btn { padding: 10px 20px; cursor: pointer; border: 1px solid #ddd; border-bottom: none; background: #f1f3f5; }
        .tab-btn.active { background: #fff; border-color: #ddd #ddd transparent #ddd; color: #007bff; font-weight: bold; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .box { padding: 15px; border: 1px solid #eee; border-radius: 4px; }
        a { text-decoration: none; color: #0056b3; font-weight: bold; }
        a:hover { text-decoration: underline; }
        .pop-table { width: 100%; border-collapse: collapse; }
        .pop-table th, .pop-table td { padding: 10px; border: 1px solid #eee; text-align: left; }
    </style>
</head>
<body>

    <h2>📈 台股資料全自動觀測系統</h2>

    <div class="card">
        <div>📅 資料日期：<span id="data-date">讀取中...</span></div>
        <div>🚦 狀態：<span id="sys-status">讀取中...</span></div>
    </div>

    <div class="tab-menu">
        <button class="tab-btn active" onclick="switchTab('ma-page', this)">📊 均線交叉訊號</button>
        <button class="tab-btn" onclick="switchTab('popular-page', this)">🔥 前十大熱門標的</button>
    </div>

    <div id="ma-page" class="tab-content active">
        <div class="grid">
            <div class="box"><h3>🔴 黃金交叉 (<span id="count-g">0</span>)</h3><ul id="list-golden"></ul></div>
            <div class="box"><h3>🟢 死亡交叉 (<span id="count-d">0</span>)</h3><ul id="list-death"></ul></div>
        </div>
    </div>

    <div id="popular-page" class="tab-content">
        <table class="pop-table">
            <thead><tr><th>代號</th><th>名稱</th><th>收盤價</th><th>金額(億)</th></tr></thead>
            <tbody id="table-popular-body"></tbody>
        </table>
    </div>

    <script>
        function switchTab(pageId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            btn.classList.add('active');
        }

        fetch('results.json?t=' + new Date().getTime())
            .then(r => r.json())
            .then(data => {
                document.getElementById('data-date').innerText = data.data_date;
                document.getElementById('sys-status').innerText = data.status;

                // 渲染均線列表 (帶跳轉連結)
                const render = (id, countId, list) => {
                    const el = document.getElementById(id);
                    document.getElementById(countId).innerText = list.length;
                    list.forEach(item => {
                        const code = item.match(/\((\d+)\)/)[1];
                        el.innerHTML += `<li><a href="https://www.wantgoo.com/stock/astock/techchart?stockno=${code}" target="_blank">${item}</a></li>`;
                    });
                };
                render('list-golden', 'count-g', data.golden);
                render('list-death', 'count-d', data.death);

                // 渲染熱門表
                const pBody = document.getElementById('table-popular-body');
                data.top10.forEach(s => {
                    pBody.innerHTML += `<tr><td>${s.code}</td><td>${s.name}</td><td>${s.price}</td><td>${s.value}</td></tr>`;
                });
            });
    </script>
</body>
</html>
