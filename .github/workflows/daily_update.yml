name: Daily Stock MA Cross Analysis (OpenAPI Version)

on:
  schedule:
    - cron: '0 10 * * 1-5' # 台北時間每週一至週五下午 6:00 自動執行
  workflow_dispatch: # 允許你隨時手動點擊 "Run workflow" 測試

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas

    - name: Run analysis script
      run: python -u main.py

    - name: Commit and push historical data and results
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # 💡 安全防呆：檢查檔案真的存在，才加入 Git 暫存區（避免週末休市沒檔案噴錯）
        [ -f history.json ] && git add history.json
        [ -f results.json ] && git add results.json
        
        # 只有在檔案真的有變更時才執行 commit 與 push
        git diff --quiet --staged || (git commit -m "Update daily price history and results" && git push)
