name: Daily Stock MA Cross Analysis

on:
  schedule:
    - cron: '0 10 * * 1-5' # 台北時間每週一至週五下午 6:00 自動執行
  workflow_dispatch: # 允許你手動點擊 "Run workflow"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas

    - name: 🛠️ 修正雲端電腦 DNS 失憶症 (強制灌入 Google / Cloudflare DNS)
      run: |
        printf "nameserver 8.8.8.8\nnameserver 1.1.1.1\n" | sudo tee /etc/resolv.conf

    - name: Run analysis script
      run: python main.py

    - name: Commit and push if results changed
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add results.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update stock cross data" && git push)
